# Mínimo para publicar as Edge Functions pela CLI. O callback do Bling é aberto pelo navegador (sem JWT);
# a proteção dele é o `state` de uso único gerado pelo painel (api.iniciar_oauth).
project_id = "gikudypnbnnugduphbpb"

[functions.bling-oauth-callback]
verify_jwt = false

[functions.integracao-salvar-segredo]
verify_jwt = true

[functions.integracao-testar]
verify_jwt = true

[functions.usuario-convidar]
verify_jwt = true

[functions.conhecimento]
verify_jwt = true

[functions.assistente-ia]
verify_jwt = true

[functions.consulta-receita]
verify_jwt = true

[functions.consulta-cep]
verify_jwt = true

# Agente de impressão: não há JWT de usuário; a autorização é o segredo do agente (api.agente_autenticar).
[functions.impressao-agente]
verify_jwt = false

# Webhook da Meta/Instagram: sem JWT de usuário; a proteção é a assinatura X-Hub-Signature-256 e o verify token.
[functions.meta-webhook]
verify_jwt = false

# Pagamento (pedido 048): chamado pela página pública do link; a autorização é o token pessoal da reserva. NÃO PUBLICADA ainda.
[functions.pagamento]
verify_jwt = false

# Notificação da Getnet: sem JWT; a proteção é o segredo "k" na URL (Integrações > Pagamentos). NÃO PUBLICADA ainda.
[functions.getnet-notificacao]
verify_jwt = false
